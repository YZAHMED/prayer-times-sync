name: Update prayer data

# Runs twice so a delayed or failed first attempt still lands well before the
# devices refresh at 02:30 local time. Both runs are idempotent.
on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 02:00 Toronto (EDT) / 01:00 (EST)
    - cron: '0 8 * * *'   # retry
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Never let two runs push at the same time.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships python3; neither script has any third-party deps,
      # so there is nothing to install and nothing to update.

      - name: Fetch timetable
        id: prayers
        env:
          PRAYER_API_KEY: ${{ secrets.PRAYER_API_KEY }}
          PRAYER_API_BASE_URL: ${{ secrets.PRAYER_API_BASE_URL }}
        run: python3 tools/update_prayers.py

      - name: Resolve fallback stream URL
        id: stream
        continue-on-error: true      # devices resolve this themselves at play time
        run: python3 tools/resolve_stream.py

      - name: Write status heartbeat
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          with open("prayers.json", encoding="utf-8") as fh:
              p = json.load(fh)
          url = ""
          if os.path.exists("stream_url.txt"):
              with open("stream_url.txt", encoding="utf-8") as fh:
                  url = fh.read().strip()
          status = {
              "updated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "prayer_date": ((p.get("data") or {}).get("prayerOfDay") or {}).get("prayerDate"),
              "mosque": (p.get("data") or {}).get("name"),
              "stream_url": url,
          }
          with open("status.json", "w", encoding="utf-8") as fh:
              json.dump(status, fh, indent=2)
              fh.write("\n")
          PY

      - name: Commit and push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # prayers.json, stream_url.txt and status.json are generated
          # artifacts: on a race the freshly generated copy is always the right
          # answer. Rebasing them is not just unnecessary, it produces add/add
          # conflicts that leave the tree unmerged so every retry then fails
          # with "Pulling is not possible because you have unmerged files".
          # So: take the latest remote state, lay our generated files over it,
          # and commit that. This cannot conflict.
          GEN=$(mktemp -d)
          FILES="prayers.json stream_url.txt status.json"
          for f in $FILES; do
            [ -f "$f" ] && cp "$f" "$GEN/$f"
          done

          for attempt in 1 2 3; do
            git fetch --quiet origin "$BRANCH"
            git reset --quiet --hard "origin/$BRANCH"

            present=""
            for f in $FILES; do
              if [ -f "$GEN/$f" ]; then
                cp "$GEN/$f" "$f"
                present="$present $f"
              fi
            done
            [ -n "$present" ] || { echo "nothing was generated"; exit 1; }

            # shellcheck disable=SC2086
            git add $present
            if git diff --staged --quiet; then
              echo "nothing changed"
              exit 0
            fi

            git commit --quiet -m "Automated update: prayer data"
            if git push --quiet origin "HEAD:$BRANCH"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed (someone pushed first); retrying"
            sleep $((attempt * 5))
          done
          echo "could not push after 3 attempts" >&2
          exit 1

      - name: Open an issue if this failed
        if: failure()
        continue-on-error: true    # a reporting failure must not mask the real one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The label may not exist yet; creating it is idempotent.
          gh label create automation-failure \
            --color B60205 --description "A scheduled data update failed" \
            >/dev/null 2>&1 || true

          body="Workflow \`${GITHUB_WORKFLOW}\` failed on $(date -u +%F).

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Devices keep running on cached times and fall back to local
          astronomical computation, so playback continues. This only needs
          attention if it repeats for several days."

          existing=$(gh issue list --label automation-failure --state open \
                       --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Prayer data update failed" \
              --label automation-failure --body "$body"
          fi
